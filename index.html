                </div>

        // ALGORITMO CHAIKIN DE SUAVIZADO DE CURVAS
        function smoothPolyline(points, iterations = 3) {
            let curr = points.slice();
            for (let it = 0; it < iterations; it++) {
                const smoothed = [];
                smoothed.push(curr[0]);
                for (let i = 0; i < curr.length - 1; i++) {
                    const p0 = curr[i];
                    const p1 = curr[i + 1];

                    const q = [
                        0.75 * p0[0] + 0.25 * p1[0],
                        0.75 * p0[1] + 0.25 * p1[1]
                    ];
                    const r = [
                        0.25 * p0[0] + 0.75 * p1[0],
                        0.25 * p0[1] + 0.75 * p1[1]
                    ];

                    smoothed.push(q);
                    smoothed.push(r);
                }
                smoothed.push(curr[curr.length - 1]);
                curr = smoothed;
            }
            return curr;
        }

        // Generar ruta suave y redondeada
        const landRailRoute = smoothPolyline(baseLandWaypoints, 2);

        // Encontrar los índices correspondientes a cada ciudad tras el suavizado
        function buildStationIndices() {
            const indices = [];
            itineraryData.forEach((dest) => {
                let bestIdx = 0;
                let minDist = Infinity;
                landRailRoute.forEach((pt, i) => {
                    const d = Math.hypot(pt[0] - dest.coords[0], pt[1] - dest.coords[1]);
                    if (d < minDist) {
                        minDist = d;
                        bestIdx = i;
                    }
                });
                indices.push(bestIdx);
            });
            return indices;
        }

        const stationRouteIndices = buildStationIndices();

        let animationFrameId = null;

                subdomains: 'abcd',
                crossOrigin: true
            }).addTo(map);

            // Línea de fondo con la ruta completa
            L.polyline(landRailRoute, {
                color: '#b8435d',
                weight: 4,
                opacity: 0.3,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            // Línea activa de la ruta
            animatedPolyline = L.polyline([landRailRoute[0]], {
                color: '#5b6e3a',
                weight: 5,
                opacity: 0.95,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            // Marcadores de paradas
            itineraryData.forEach((dest, index) => {
                const customIcon = L.divIcon({
                    className: 'custom-station-wrapper',
                    html: `<div id="marker-${index}" class="custom-station-icon w-8 h-8 text-xs">${index + 1}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker(dest.coords, { icon: customIcon }).addTo(map);
                
                marker.on('click', () => {
                    if (isAnimating) stopTourAnimation();
                    selectDestination(index);
                });

                stationMarkers.push(marker);
            });

            <!-- Marcador flotante del Tren -->

                html: `
                    <div class="w-11 h-11 rounded-full bg-white border-2 border-rumea-olive shadow-xl flex items-center justify-center p-0 overflow-hidden transition-transform hover:scale-110">
                        <img src="https://i.ibb.co/0jzXdM6J/rumea-logo.png" alt="Rumea Tren" class="w-full h-full object-contain scale-[1.55] translate-x-[0.5px]">
                    </div>
                `,
                iconSize: [44, 44],
                iconAnchor: [22, 22]
            });

            trainMarker = L.marker(itineraryData[0].coords, { 
                icon: trainIcon,
                zIndexOffset: 2000 
            }).addTo(map);

            window.addEventListener('resize', () => {
                if (map) map.invalidateSize();
            });
        }

        // MOSTRAR BADGES SUPERIORES
        function renderTimelineBadges() {
            const container = document.getElementById('timelineBadges');
            container.innerHTML = itineraryData.map((dest, idx) => `
                <button onclick="if(isAnimating) stopTourAnimation(); selectDestination(${idx})" id="badge-${idx}" class="px-3 py-1 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center space-x-1.5 text-slate-500 hover:text-slate-900 hover:bg-slate-100">
                    <span class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span>${dest.city}</span>
                </button>
            `).join('');
        }

        // SELECCIONAR DESTINO CON VERIFICACIÓN DE SEGURIDAD
        function selectDestination(index, initialSetup = false) {
            currentDestinationIndex = index;
            const data = itineraryData[index];

            if (!data || !data.coords || isNaN(data.coords[0]) || isNaN(data.coords[1])) return;

            if (map) {
                map.invalidateSize();
                if (initialSetup) {
                    map.setView(data.coords, 6);
                } else {
                    map.flyTo(data.coords, 6, {
                        animate: true,
                        duration: 1.0
                    });
                }
            }

            if (trainMarker && !isAnimating) {
                trainMarker.setLatLng(data.coords);
            }

            const targetRouteIndex = stationRouteIndices[index];
            const activePath = landRailRoute.slice(0, targetRouteIndex + 1);
            if (animatedPolyline) {
                animatedPolyline.setLatLngs(activePath);
            }

            itineraryData.forEach((_, idx) => {
                const el = document.getElementById(`marker-${idx}`);
                const badge = document.getElementById(`badge-${idx}`);
                
                if (el) {
                    if (idx === index) el.classList.add('active');
                    else el.classList.remove('active');
                }

                if (badge) {
                    if (idx === index) {
                        badge.className = "px-3 py-1 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center space-x-1.5 bg-rumea-500 text-white shadow-sm shadow-rumea-500/20";
                    } else {
                        badge.className = "px-3 py-1 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center space-x-1.5 text-slate-500 hover:text-slate-900 hover:bg-slate-100";
                    }
                }
            });

            document.getElementById('currentStepIndex').innerText = index + 1;
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === itineraryData.length - 1);

            renderDetailsPanel(data);
        }

        // RENDERIZAR PANEL LATERAL
        function renderDetailsPanel(data) {
            const container = document.getElementById('detailsContent');
            
            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');

            const fullStars = Math.floor(data.accommodation.rating);
            const hasHalfStar = (data.accommodation.rating % 1) >= 0.5;
            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '<i class="fa-solid fa-star text-amber-400 text-xs"></i>';
            }
            if (hasHalfStar) {
                starsHtml += '<i class="fa-solid fa-star-half-stroke text-amber-400 text-xs"></i>';
            }

            container.innerHTML = `
                <div class="relative h-44 rounded-2xl overflow-hidden shadow-sm border border-slate-100 group">
                    <img src="${data.image}" alt="${data.city}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80'">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/20 to-transparent"></div>
                    
                    <div class="absolute bottom-3 left-4 right-4 flex items-end justify-between">
                        <div>
                            <span class="px-2.5 py-0.5 bg-rumea-500/90 text-white text-[10px] font-extrabold uppercase tracking-wider rounded-md mb-1 inline-block">
                                ${data.days}
                            </span>
                            <h2 class="text-2xl font-extrabold text-white tracking-tight">${data.city}</h2>
                            <p class="text-xs text-slate-200 flex items-center">
                                <i class="fa-solid fa-location-dot text-rumea-300 mr-1.5"></i>${data.country}
                            </p>
                        </div>
                    </div>
                </div>

                <div class="bg-rumea-50/60 border border-rumea-100 p-3.5 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 flex items-center justify-center shrink-0">
                            <img src="https://i.ibb.co/0jzXdM6J/rumea-logo.png" alt="Rumea Tren" class="w-full h-full object-contain scale-125">
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-500 block font-semibold uppercase">Trayecto en Tren</span>
                            <span class="text-xs font-bold text-slate-800">${data.trainInfo.from} → ${data.city}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-extrabold text-rumea-olive block">${data.trainInfo.duration}</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center">
                        <i class="fa-solid fa-list-check text-rumea-500 mr-2"></i> Qué visitaremos
                    </h3>
                    <ul class="space-y-2">
                        ${data.activities.map((act) => `
                            <li class="flex items-center space-x-3 bg-slate-50 border border-slate-100 p-2.5 rounded-xl">
                                <i class="fa-solid fa-star text-rumea-500 text-xs shrink-0 ml-1"></i>
                                <span class="text-xs text-slate-700 font-medium my-auto">${act}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 flex items-center">
                        <i class="fa-solid fa-bed text-rumea-500 mr-2"></i> Dónde nos alojamos
                    </h3>
                    <div class="bg-slate-50 border border-slate-100 p-3.5 rounded-2xl space-y-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-800">${data.accommodation.name}</h4>
                            <a href="${data.accommodation.mapsUrl}" target="_blank" title="Ver en Google Maps" class="w-8 h-8 rounded-xl bg-white border border-slate-200 hover:border-rumea-500 hover:shadow-md flex items-center justify-center transition-all p-1.5 group shrink-0">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Google_Maps_icon_%282026%29.svg/250px-Google_Maps_icon_%282026%29.svg.png" 
                                     alt="Google Maps" 
                                     class="w-full h-full object-contain transition-transform group-hover:scale-110"
                                     onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Google_Maps_icon_%282020-2026%29.svg/250px-Google_Maps_icon_%282020-2026%29.svg.png';">
                            </a>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="flex items-center space-x-1">
                                ${starsHtml}
                            </div>
                            <span class="text-xs font-bold text-slate-700">${data.accommodation.rating}</span>
                            <span class="text-[10px] text-slate-400">en Google Maps</span>
                        </div>
                        <p class="text-xs text-slate-500 flex items-center">
                            <i class="fa-solid fa-map-pin text-slate-400 mr-2 w-3"></i> ${data.accommodation.location}
                        </p>
                    </div>
                </div>
            `;
        }

        // NAVEGACIÓN ANTERIOR / SIGUIENTE
        function navigateDestination(direction) {
            if (isAnimating) stopTourAnimation();
            const newIndex = currentDestinationIndex + direction;
            if (newIndex >= 0 && newIndex < itineraryData.length) {
                selectDestination(newIndex);
            }
        }

        // ANIMACIÓN DE RUTA Y TREN
        function toggleTourAnimation() {
            if (isAnimating) {
                stopTourAnimation();
            } else {
                startTourAnimation();
            }
        }

        function startTourAnimation() {
            isAnimating = true;
            document.getElementById('playIcon').className = "fa-solid fa-pause text-[10px]";
            document.getElementById('playText').innerText = "PAUSAR RUTA";

            if (currentDestinationIndex >= itineraryData.length - 1) {
                selectDestination(0);
            }

            animateSegment(currentDestinationIndex);
        }

        function animateSegment(fromStationIdx) {
            if (!isAnimating || fromStationIdx >= itineraryData.length - 1) {
                stopTourAnimation();
                return;
            }

            const startPtIdx = stationRouteIndices[fromStationIdx];
            const endPtIdx = stationRouteIndices[fromStationIdx + 1];
            const segmentPoints = landRailRoute.slice(startPtIdx, endPtIdx + 1);

            let currentPt = 0;
            const totalSteps = 5; // Reducido aún más (de 12 a 5) para un desplazamiento ultra rápido entre paradas
            let step = 0;

            function stepAnimation() {
                if (!isAnimating) return;

                if (currentPt < segmentPoints.length - 1) {
                    const p1 = segmentPoints[currentPt];
                    const p2 = segmentPoints[currentPt + 1];

                    const lat = p1[0] + (p2[0] - p1[0]) * (step / totalSteps);
                    const lng = p1[1] + (p2[1] - p1[1]) * (step / totalSteps);
                    const currentPos = [lat, lng];

                    trainMarker.setLatLng(currentPos);

                    const pathSoFar = landRailRoute.slice(0, startPtIdx + currentPt + 1);
                    pathSoFar.push(currentPos);
                    animatedPolyline.setLatLngs(pathSoFar);

                    step++;
                    if (step > totalSteps) {
                        step = 0;
                        currentPt++;
                    }

                    animationFrameId = requestAnimationFrame(stepAnimation);
                } else {
                    const nextStationIdx = fromStationIdx + 1;
                    selectDestination(nextStationIdx, false);

                    setTimeout(() => {
                        if (isAnimating) {
                            animateSegment(nextStationIdx);
                        }
                    }, 1800); // Pausa más prolongada (1.8 segundos) en cada destino para apreciar la tarjeta
                }
            }

            stepAnimation();
        }

        function stopTourAnimation() {
            isAnimating = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            document.getElementById('playIcon').className = "fa-solid fa-play text-[10px]";
            document.getElementById('playText').innerText = "REPRODUCIR RUTA";
        }

        // MODAL DE RESERVA
        function showBookingModal() {
            const modal = document.getElementById('bookingModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
        }

        function closeBookingModal() {
            const modal = document.getElementById('bookingModal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function handleBookingSubmit(event) {
            event.preventDefault();
            closeBookingModal();
            
            const notification = document.createElement('div');
            notification.className = 'fixed bottom-6 right-6 z-50 bg-rumea-500 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 fade-in';
            notification.innerHTML = `
                <i class="fa-solid fa-circle-check text-lg"></i>
                <span class="text-xs font-bold">¡Solicitud enviada a RUMEA! Nos pondremos en contacto pronto.</span>
            `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 4000);
        }
    </script>
</body>
</html>
